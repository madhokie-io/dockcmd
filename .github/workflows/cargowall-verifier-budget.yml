name: cargowall-verifier-budget

# Measures how many instructions the kernel's BPF verifier processes for each
# cargowall program on THIS runner's kernel, by running cargowall's own
# TestVerifierBudget. The count is kernel-specific: Blacksmith's 6.6 rejects
# cg_origin_egress at the 1M limit while the 6.17 kernel cargowall's CI runs
# on verifies it in ~660k (code-cargo/cargowall#138). Nothing is attached or
# enforced. The job is red when a program does not load or crosses the
# test's tripwire; the per-program lines land in the job summary either way.
on:
  workflow_dispatch:
    inputs:
      cargowall_ref:
        description: code-cargo/cargowall git ref to measure
        # TODO: switch to main once TestVerifierBudget (code-cargo/cargowall
        # PR #139) has merged.
        default: matt/verifier-budget
      runner:
        description: runner label — this picks the kernel under test
        default: blacksmith-2vcpu-ubuntu-2404
  pull_request:
    paths:
      - .github/workflows/cargowall-verifier-budget.yml

jobs:
  measure:
    name: verifier budget on ${{ inputs.runner || 'blacksmith-2vcpu-ubuntu-2404' }}
    runs-on: ${{ inputs.runner || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout cargowall
        uses: actions/checkout@v6
        with:
          repository: code-cargo/cargowall
          ref: ${{ inputs.cargowall_ref || 'matt/verifier-budget' }}
          path: cargowall

      - uses: actions/setup-go@v6
        with:
          go-version-file: cargowall/go.mod
          cache-dependency-path: cargowall/go.sum

      # Root is needed to load BPF programs; sudo drops the runner's PATH, so
      # hand it the Go toolchain explicitly.
      - name: Measure
        working-directory: cargowall
        run: |
          set -o pipefail
          status=0
          sudo env "PATH=$PATH" go test -count=1 -run '^TestVerifierBudget$' -v ./bpf/ 2>&1 \
            | tee "$RUNNER_TEMP/verifier.txt" || status=$?
          {
            echo "### CargoWall BPF verifier budget on \`$(uname -r)\`"
            echo
            echo '```'
            grep -E 'verifier:|uses .* of the verifier budget' "$RUNNER_TEMP/verifier.txt" \
              | sed -E 's/^\s*verifier_budget_test.go:[0-9]+: //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
